<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Diabetes Risk Check{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="description" content="Estimate your diabetes risk from a few simple inputs, see what drives the result, and track it over time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315262B'/%3E%3Cpath d='M6 21a10 10 0 0 1 20 0' fill='none' stroke='%235FD8AA' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='13' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block nav %}
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M6 21a10 10 0 0 1 20 0" fill="none" stroke="#5FD8AA" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="13" r="2.2" fill="#fff"/></svg>
        <span>Diabetes Risk Check</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        {% if current_user %}
          <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Check risk</a>
          <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        {% endif %}
        <a href="{{ url_for('models_page') }}" {% if request.endpoint == 'models_page' %}aria-current="page"{% endif %}>Models</a>
        <a href="{{ url_for('deploy_page') }}" {% if request.endpoint == 'deploy_page' %}aria-current="page"{% endif %}>Cloud Deploy</a>
      </nav>
      <div class="nav-user">
        {% if current_user %}
          <span class="nav-name">{{ current_user['name'] }}</span>
          <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="link-btn" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="link-btn" href="{{ url_for('auth.login') }}">Sign in</a>
        {% endif %}
      </div>
    </div>
  </header>
  {% endblock %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animations.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
